name: Repair site

on:
  push:
    paths:
      - 'repair.trigger'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          broken = "97000]}};const R="
          fixed = "97000]}}};const R="
          if broken not in html:
              raise SystemExit('Expected broken JavaScript pattern was not found')
          html = html.replace(broken, fixed, 1)
          index.write_text(html, encoding='utf-8')
          PY
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          Path('/tmp/site.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/site.js
      - name: Commit repaired site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix chart rendering syntax error"
          git push
