name: Repair site and add Excel

on:
  push:
    paths:
      - 'excel_parts/part11.txt'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair JavaScript and rebuild Excel
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          broken = "97000]}};const R="
          fixed = "97000]}}};const R="
          if broken in html:
              html = html.replace(broken, fixed, 1)

          if 'class="excel-fab"' not in html:
              fab_css = '''
.excel-fab{position:fixed;inset-inline-end:24px;bottom:24px;z-index:60;display:flex;align-items:center;gap:10px;padding:14px 18px;border-radius:999px;background:#073b3a;color:#fff;border:1px solid rgba(255,255,255,.16);box-shadow:0 20px 45px rgba(7,59,58,.28);font-weight:700;transition:.2s}.excel-fab:hover{transform:translateY(-3px);box-shadow:0 24px 55px rgba(7,59,58,.35)}.excel-fab svg{width:20px;height:20px;flex:none}@media(max-width:650px){.excel-fab{width:54px;height:54px;padding:0;justify-content:center}.excel-fab span{display:none}}@media print{.excel-fab{display:none!important}}
'''
              html = html.replace('</style>', fab_css + '</style>', 1)
              fab = '''<a class="excel-fab" href="Rabieh_Investor_Feasibility_Dynamic_Model.xlsx" download aria-label="تنزيل ملف Excel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg><span data-ar="تنزيل ملف Excel" data-en="Download Excel">تنزيل ملف Excel</span></a>'''
              html = html.replace('</body>', fab + '</body>', 1)

          index.write_text(html, encoding='utf-8')

          parts = sorted(Path('excel_parts').glob('part*.txt'))
          payload = ''.join(p.read_text().strip() for p in parts)
          Path('Rabieh_Investor_Feasibility_Dynamic_Model.xlsx').write_bytes(base64.b64decode(payload))
          PY
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          Path('/tmp/site.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/site.js
      - name: Commit repaired site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html Rabieh_Investor_Feasibility_Dynamic_Model.xlsx
          git commit -m "Fix charts and add Excel download" || exit 0
          git push
